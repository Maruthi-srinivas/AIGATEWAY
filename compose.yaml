name: aigateway

x-auth-env: &auth-env
  POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://aigateway:aigateway@postgres:5432/aigateway}
  JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
  INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-internal-token-change-me}
  SEED_PASSWORD: ${SEED_PASSWORD:-changeme}
  SEED_HR_API_KEY: ${SEED_HR_API_KEY:-agt_demo_hr_local_docker_only_key}
  SEED_ENG_API_KEY: ${SEED_ENG_API_KEY:-agt_demo_eng_local_docker_only_key}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aigateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aigateway}
      POSTGRES_DB: ${POSTGRES_DB:-aigateway}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigateway -d aigateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.migrate
    healthcheck:
      disable: true
    environment:
      <<: *auth-env
      SERVICE_NAME: migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.app
      args:
        PACKAGE: aigateway-auth
        MODULE: aigateway.auth.main:app
        HEALTH_PATH: /health
        PORT: "8000"
    environment:
      <<: *auth-env
      SERVICE_NAME: auth
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: "8000"
      SEED_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.app
      args:
        PACKAGE: aigateway-gateway
        MODULE: aigateway.gateway.main:app
        HEALTH_PATH: /v1/health
        PORT: "8000"
    ports:
      - "8000:8000"
    environment:
      SERVICE_NAME: gateway
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: "8000"
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://aigateway:aigateway@postgres:5432/aigateway}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_BASE_URL: http://auth:8000
      GUARDRAILS_BASE_URL: http://guardrails:8000
      RAG_BASE_URL: http://rag:8000
      RAG_TIMEOUT: ${RAG_TIMEOUT:-2}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-internal-token-change-me}
      RATE_LIMIT_TENANT_PER_MINUTE: ${RATE_LIMIT_TENANT_PER_MINUTE:-60}
      RATE_LIMIT_USER_PER_MINUTE: ${RATE_LIMIT_USER_PER_MINUTE:-20}
      RATE_LIMIT_API_KEY_PER_MINUTE: ${RATE_LIMIT_API_KEY_PER_MINUTE:-60}
      STUB_STREAM_DELAY_MS: ${STUB_STREAM_DELAY_MS:-20}
      CHAT_BODY_MAX_BYTES: ${CHAT_BODY_MAX_BYTES:-32768}
      CHAT_MESSAGE_MAX_CHARS: ${CHAT_MESSAGE_MAX_CHARS:-8000}
      LLM_MODE: ${LLM_MODE:-fixture}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_PUBLISH_TIMEOUT_SECONDS: ${KAFKA_PUBLISH_TIMEOUT_SECONDS:-0.5}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      guardrails:
        condition: service_healthy
      rag:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.app
      args:
        PACKAGE: aigateway-worker
        MODULE: aigateway.worker.main:app
        HEALTH_PATH: /health
        PORT: "8000"
    environment:
      SERVICE_NAME: worker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: "8000"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-internal-token-change-me}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped

  rag:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.app
      args:
        PACKAGE: aigateway-rag
        MODULE: aigateway.rag.main:app
        HEALTH_PATH: /health
        PORT: "8000"
    environment:
      SERVICE_NAME: rag
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: "8000"
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://aigateway:aigateway@postgres:5432/aigateway}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-internal-token-change-me}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-fixture}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-https://api.openai.com/v1/embeddings}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.3}
      RAG_TOP_K: ${RAG_TOP_K:-8}
      RAG_CANDIDATE_K: ${RAG_CANDIDATE_K:-32}
      RAG_CONTEXT_MAX_CHARS: ${RAG_CONTEXT_MAX_CHARS:-8000}
      RAG_TIMEOUT_SECONDS: ${RAG_TIMEOUT_SECONDS:-2}
      SEED_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
    restart: unless-stopped

  guardrails:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.app
      args:
        PACKAGE: aigateway-guardrails
        MODULE: aigateway.guardrails.main:app
        HEALTH_PATH: /health
        PORT: "8000"
    environment:
      SERVICE_NAME: guardrails
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: "8000"
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://aigateway:aigateway@postgres:5432/aigateway}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-internal-token-change-me}
      GUARDRAILS_MODE: ${GUARDRAILS_MODE:-fixture}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      GUARDRAILS_API_URL: ${GUARDRAILS_API_URL:-https://commentanalyzer.googleapis.com/v1alpha1/comments:analyze}
      GUARDRAILS_API_KEY: ${GUARDRAILS_API_KEY:-}
      GUARDRAILS_MODERATION_THRESHOLD: ${GUARDRAILS_MODERATION_THRESHOLD:-0.7}
      GUARDRAILS_TIMEOUT_SECONDS: ${GUARDRAILS_TIMEOUT_SECONDS:-2}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_API_URL: ${JEV_API_URL:-https://api.typesafe.ai/v1/systemone}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-0.8}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  evals:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.app
      args:
        PACKAGE: aigateway-evals
        MODULE: aigateway.evals.main:app
        HEALTH_PATH: /health
        PORT: "8000"
    environment:
      SERVICE_NAME: evals
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: "8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        VITE_GATEWAY_ORIGIN: ${VITE_GATEWAY_ORIGIN:-http://localhost:8000}
    ports:
      - "5173:8080"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infrastructure/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  test:
    profiles: [test]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.test
    environment:
      GATEWAY_URL: http://gateway:8000
      WORKER_URL: http://worker:8000
      RAG_URL: http://rag:8000
      GUARDRAILS_URL: http://guardrails:8000
      EVALS_URL: http://evals:8000
      GRAFANA_URL: http://grafana:3000
      AUTH_URL: http://auth:8000
      POSTGRES_DSN: postgresql://aigateway:aigateway@postgres:5432/aigateway
      REDIS_URL: redis://redis:6379/0
      AUTH_BASE_URL: http://auth:8000
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-internal-token-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
      SEED_PASSWORD: ${SEED_PASSWORD:-changeme}
      SEED_HR_API_KEY: ${SEED_HR_API_KEY:-agt_demo_hr_local_docker_only_key}
      JEV_API_KEY: ${JEV_API_KEY:-}
      SERVICE_NAME: test
    depends_on:
      gateway:
        condition: service_healthy
      auth:
        condition: service_healthy
      worker:
        condition: service_healthy
      rag:
        condition: service_healthy
      guardrails:
        condition: service_healthy
      evals:
        condition: service_healthy
      grafana:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  tempo_data:
