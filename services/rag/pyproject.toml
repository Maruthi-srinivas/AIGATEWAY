[project]
name = "aigateway-rag"
version = "0.5.0"
description = "Document store and vector retrieval for AI Safety Gateway"
requires-python = ">=3.12"
dependencies = [
    "aigateway-config",
    "aigateway-contracts",
    "aigateway-telemetry",
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigateway"]

[tool.hatch.build.targets.wheel.sources]
src = ""
