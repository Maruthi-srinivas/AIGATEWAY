[project]
name = "aigateway-rag"
version = "0.1.0"
description = "RAG service stub for AI Safety Gateway"
requires-python = ">=3.12"
dependencies = [
    "aigateway-config",
    "aigateway-telemetry",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigateway"]

[tool.hatch.build.targets.wheel.sources]
src = ""
