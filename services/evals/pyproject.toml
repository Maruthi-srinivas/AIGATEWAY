[project]
name = "aigateway-evals"
version = "0.1.0"
description = "Lexical evaluation store for AI Safety Gateway"
requires-python = ">=3.12"
dependencies = [
    "aigateway-config",
    "aigateway-contracts",
    "aigateway-telemetry",
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigateway"]

[tool.hatch.build.targets.wheel.sources]
src = ""
