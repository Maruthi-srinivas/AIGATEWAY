[project]
name = "aigateway-auth"
version = "0.2.0"
description = "Authentication, tenancy, and audit service"
requires-python = ">=3.12"
dependencies = [
    "aigateway-config",
    "aigateway-contracts",
    "aigateway-telemetry",
    "argon2-cffi>=23.1",
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigateway"]

[tool.hatch.build.targets.wheel.sources]
src = ""
